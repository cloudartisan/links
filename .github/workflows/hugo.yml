name: Hugo Build and Deploy

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# Required for allowing GitHub Actions to push to your repository
permissions:
  contents: write
  pages: write
  id-token: write

# Only newer runs of this workflow for the same PR supersede older work.
# Non-PR runs have unique keys, preserving every main/manual/scheduled run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v2
        with:
          hugo-version: 'latest'
          extended: true

      - name: Build
        run: hugo --minify

      - name: Deploy
        uses: peaceiris/actions-gh-pages@v3
        if: ${{ github.ref == 'refs/heads/main' }}
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          cname: links.cloudartisan.com 